auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 720h # 30d
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # One [7d] instant query read 2.7 GB and took Loki to 94.8 % (2026-11-10). Run long reads as hour windows.
  max_query_length: 169h
  max_query_range: 25h
  tsdb_max_query_parallelism: 8
  max_query_parallelism: 4
  split_queries_by_interval: 1h # default, pinned on purpose
  # Loki splits an instant [8d] into [1h] pieces, so max_query_range never sees it. Off, the engine refuses it.
  split_instant_metric_queries_by_interval: 0s
querier:
  max_concurrent: 2
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
