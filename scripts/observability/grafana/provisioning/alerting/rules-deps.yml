apiVersion: 1
groups:
  - orgId: 1
    name: deps-extended
    folder: docs.plus
    interval: 1m
    rules:
      - uid: dep-postgres-down
        title: Postgres down (pg_up==0)
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Postgres is down (pg_up==0). If the apps are healthy, the exporter may be what fails. Read its log first.
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#postgres-down'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'pg_up'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: dep-rest-db-health-503
        title: REST database health check failing (2+ in 15m)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: REST's Prisma check on /health/database answered 503 at least twice in 15m. On 2026-11-01 this was the only early sign, 3 h 39 min before page loads failed (https://github.com/docs-plus/docs.plus/issues/710).
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # increase() extrapolates: one 503 read 1.034 and two read 2.069 on 2026-11-01,
              # so 1.5 means two. The first 503 after a REST start counts only when REST
              # seeds this series at 0.
              expr: 'sum(increase(http_requests_total{job="rest-api",route="/health/database",status="503"}[15m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1.5] }
              refId: C

      - uid: dep-redis-down
        title: Redis down (redis_up==0)
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Redis is down (redis_up==0). Document saves pause silently while it is down, and no counter moves. Check the docsplus-redis container.
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#redis-down'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # The store lock fails as a quorum error with an empty message after
              # about 43 s, so no save counter or rejection counter moves. This
              # rule is the only signal for that outage.
              expr: 'min(redis_up)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: dep-postgres-conn-saturation
        title: Postgres connection saturation (>80%)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Postgres connections above 80% of max_connections for 5m; tune after baseline
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # max() collapses the RHS to one labelless series so on() can never hit
              # a many-to-one error if a second pg exporter ever appears.
              expr: 'sum(pg_stat_activity_count) / on() max(pg_settings_max_connections)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }
              refId: C

      - uid: dep-postgres-db-size
        title: Postgres databases above 60% of cluster disk
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          # One rule, two severities: 80% of disk minus WAL pages as critical.
          severity: '{{ if gt $values.B.Value 48476717056.0 }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'All databases on the collab cluster hold {{ humanize1024 $values.B.Value }}B. The bar is 60% of the disk minus WAL, and this sum leaves WAL out (https://github.com/docs-plus/docs.plus/issues/727).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # The disk is shared, so the sum covers every datname (ruled 2026-11-11).
              # dep-postgres-down pages when the exporter stops, so no data is OK.
              expr: 'sum(pg_database_size_bytes)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [35591815168] }
              refId: C

      - uid: dep-postgres-db-growth
        title: Postgres databases grew more than 128 MiB in 24h
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'All databases on the collab cluster grew {{ humanize1024 $values.B.Value }}B in 24h. On 2026-11-07 they grew 199,221,248 B with no MCP write (https://github.com/docs-plus/docs.plus/issues/761).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # A dump and restore or a major upgrade shrinks the sum, so that day
              # reads a negative delta and stays Normal.
              expr: 'sum(pg_database_size_bytes) - sum(pg_database_size_bytes offset 24h)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [134217728] }
              refId: C

      - uid: dep-tls-cert-expiry
        title: TLS certificate expiring within 14 days
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Newest TLS cert for {{ $labels.cn }} expires within 14 days
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Traefik keeps leftover ACME certs after renew. min() pages those
              # leftovers. max by cn is the cert that hostname actually presents.
              # 1209600 = 14 days in seconds.
              expr: 'max by (cn) (traefik_tls_certs_not_after) - time()'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1209600] }
              refId: C
