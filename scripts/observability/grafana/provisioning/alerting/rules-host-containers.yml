apiVersion: 1
groups:
  - orgId: 1
    name: incident-metrics
    folder: docs.plus
    interval: 1m
    rules:
      - uid: incident-oom-risk
        title: Container memory near limit (OOM risk)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} is using >90% of its cgroup memory limit for 5m (OOM risk)'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#ws-container-out-of-memory'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max by (name) (container_memory_working_set_bytes{name!=""} / clamp_min(container_spec_memory_limit_bytes{name!=""}, 1))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.9] }
              refId: C

      - uid: incident-crash-loop
        title: Container crash loop (restarts increasing)
        condition: C
        for: 0s
        # OK, not Alerting: `changes(...) > 2` returns NO series on a healthy host
        # (nothing restarted >2x) -> NoData. A dead cadvisor is caught by
        # infra-target-down-telemetry instead, so this can't go silently blind.
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: A container restarted in the last 15m (crash loop)
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max by (name) (changes(container_start_time_seconds{name!=""}[15m]) > 2)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-oom-kill
        title: Kernel OOM kill on the production host
        condition: C
        for: 0s
        # incident-oom-risk needs 5m above 0.9 of the limit, so a store-job peak of a few
        # seconds never trips it. The kernel counter sees the kill itself (#737).
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: The kernel killed a process for memory in the last 10m. On the host, run dmesg -T and look for killed process. The counter is host-wide.
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#ws-container-out-of-memory'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(increase(node_vmstat_oom_kill[10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-rss-peak
        title: Process memory peak near its container limit
        condition: C
        for: 0s
        # Each arm is 80 % of that service's limit: worker 2G, server 1G, rest-api 512M.
        # Change an arm when its limit in docker-compose.prod.yml changes (#737).
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Job {{ $labels.job }} on {{ $labels.instance }} passed 80 % of its memory limit in the last 5m. The thresholds follow the limits in docker-compose.prod.yml.
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#ws-container-out-of-memory'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max by (job, instance) (max_over_time(process_resident_memory_bytes{job="hocuspocus-worker"}[5m])) > 1717986918 or max by (job, instance) (max_over_time(process_resident_memory_bytes{job="hocuspocus-server"}[5m])) > 858993459 or max by (job, instance) (max_over_time(process_resident_memory_bytes{job="rest-api"}[5m])) > 429496729'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: loki-memory-high
        title: Loki memory above 80% of its limit
        condition: C
        for: 10m
        # Our own wide LogQL reads took Loki to 94.8 % of its limit (2026-11-10). A backtest
        # found 9 such episodes in 13 days on 512M. On 768M: none in 27 h, peak 91 % (#712).
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Loki passed 80% of its memory. Stop any wide LogQL query; run it as one-hour windows, one at a time.
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#loki-near-its-memory-limit'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(max_over_time(container_memory_working_set_bytes{name="docsplus-loki"}[5m])) / clamp_min(max(container_spec_memory_limit_bytes{name="docsplus-loki"}), 1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }
              refId: C

      - uid: dep-redis-evictions
        title: Redis evicting keys (volatile-lru active)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Redis is evicting keys, and here an eviction is a discarded document save. Claim-check document states (~262 kB) are the only keys carrying a TTL — BullMQ job hashes (~1.3 kB) have none — so volatile-lru can only ever pick the document bytes. Raise maxmemory or drain the store queue.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'increase(redis_evicted_keys_total[15m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: dep-redis-maxmemory
        title: Redis near maxmemory (>90%)
        condition: C
        for: 5m
        # OK, not Alerting: the `(redis_memory_max_bytes > 0)` guard empties the
        # expression when maxmemory is unset -> NoData. A dead redis-exporter is
        # caught by infra-target-down (critical).
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Redis memory usage exceeds 90% of maxmemory limit
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'redis_memory_used_bytes / (redis_memory_max_bytes > 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.9] }
              refId: C

      - uid: dep-traefik-5xx
        title: Traefik 5xx surge
        condition: C
        for: 5m
        # OK, not Alerting: sum over zero 5xx series is empty -> NoData on a quiet
        # system. A dead traefik is caught by infra-target-down (critical).
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Traefik 5xx error rate exceeds 1 req/s for 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C

  - orgId: 1
    name: infra-meta
    folder: docs.plus
    interval: 1m
    rules:
      - uid: infra-target-down
        title: Core scrape target down (up==0)
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: A core scrape target is down (up==0)
          runbook_url: 'Restart the affected service (docker compose restart <svc>); check the host and scrape config.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'up{job=~"rest-api|hocuspocus-server|hocuspocus-worker|postgres-exporter|redis-exporter|traefik"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: infra-replica-missing
        title: App replica missing (fewer than 2 up)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Fewer than 2 replicas of {{ $labels.job }} are up for 5m. Check docker compose ps for that service and read the logs of the missing container.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # A lost replica's `up` series vanishes from DNS discovery, so
              # infra-target-down cannot see it. The vector(0) arms keep a job
              # that lost every replica at 0.
              expr: 'sum by (job) (up{job=~"rest-api|hocuspocus-server|hocuspocus-worker"}) or on (job) (label_replace(vector(0),"job","rest-api","","") or label_replace(vector(0),"job","hocuspocus-server","","") or label_replace(vector(0),"job","hocuspocus-worker","",""))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [2] }
              refId: C

      - uid: infra-target-down-telemetry
        title: Telemetry scrape target down (up==0)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A telemetry target (cadvisor/node-exporter) is down for 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'up{job=~"cadvisor|node-exporter"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: infra-disk-space
        title: Filesystem free space low (<10%)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Filesystem available space below 10% for 5m
          runbook_url: 'Clean docker logs / loki chunks; check the postgres data dir.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'min by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.10] }
              refId: C

      - uid: infra-host-memory
        title: Host available memory low (<10%)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Host available memory below 10% for 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.10] }
              refId: C
