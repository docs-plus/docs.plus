apiVersion: 1
groups:
  - orgId: 1
    name: realtime
    folder: docs.plus
    interval: 1m
    rules:
      - uid: realtime-ws-auth-rejection
        title: WS auth rejections elevated
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Majority of WS connections auth-rejected (reconnect storm / token-verify failure)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Ratio, not absolute rate: a small baseline of expired tabs stays quiet,
              # but a connect->reject->reconnect storm pushes rejected/connections high.
              # clamp_min avoids divide-by-zero when the socket pool is idle.
              expr: 'sum(rate(ws_auth_rejections_total[5m])) / clamp_min(sum(rate(ws_connections_total[5m])), 1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C

      - uid: realtime-doc-persist-slow
        title: Document persist enqueue p99 slow (>0.5s)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: store-hook enqueue overhead p99 >0.5s (blocks WS event loop). Actual DB write latency is covered by worker rules.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Traffic guard: with saves this sparse a single slow flush owns
              # the p99; below ~6 persists/5m the guard suppresses (noDataState
              # OK) instead of paging on a one-document artifact. The total-stop
              # case it hides is realtime-doc-persist-stalled's job, not this one's.
              expr: 'histogram_quantile(0.99, sum by (le) (rate(document_persist_duration_seconds_bucket[5m]))) and (sum(rate(document_persist_duration_seconds_count[5m])) > 0.02)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C

      - uid: realtime-doc-persist-stalled
        title: Edits arriving but no document saved
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Edits are reaching hocuspocus-server, but no store hook has finished for 20m. Check Redis first: a Redis outage pauses saves. Then confirm edits are still above 0 and read the hocuspocus-server logs. Restart one replica only as a last resort; a restart drops its live connections.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#edits-arriving-but-no-document-saved'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Gated on edits, not connections: readers who never type trigger no
              # save. Fleet-wide on purpose, because both replicas count a relayed
              # edit but only one stores it. `for: 10m` on the 10m window means
              # 20m of edits with no save.
              expr: 'sum(rate(ydoc_update_bytes_count{job="hocuspocus-server"}[10m])) > 0 unless on () sum(rate(document_persist_duration_seconds_count{job="hocuspocus-server"}[10m])) > 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: realtime-doc-store-rejections
        title: Document saves rejected (writes dropped)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'The store hook rejected a document save (reason={{ $labels.reason }}). Those edits are gone once the room unloads. Check hocuspocus-server logs and the Postgres/queue health for the same window.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#document-saves-rejected'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Every rejection is lost user text, so there is no tolerance band.
              # By reason so the page names the failure without opening logs.
              expr: 'sum by (reason) (increase(document_store_rejections_total[10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: realtime-content-apply-errors
        title: Content apply failed (REST injection into a live document)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'A PATCH /content could not open or persist the document (mode={{ $labels.mode }}). API.md names this counter as the operator signal for it. A store rejection already pages critical at realtime-doc-store-rejections; what lands here is an open failure, or a persist failure that did not reach the store fallback. Read the hocuspocus-server logs for "Content apply failed" and the requestId on the line.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # No tolerance band, but warning not critical: the caller already
              # got a 500 and can retry. These sit under slo-http-5xx-ratio's 5%
              # of all REST traffic, so without this rule nobody is paged until a
              # caller reports it.
              expr: 'sum by (mode) (increase(document_content_apply_total{outcome="error"}[10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: realtime-stateless-relay-forged
        title: Stateless relay refused a forged control frame
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'The relay refused a frame it will not forward (reason={{ $labels.reason }}). `type-not-allowed` and `broadcast-frame` mean a client is trying to mint the access events the webapp obeys — identify the connection before widening anything. `oversized` is excluded here; it is a capacity signal, not abuse.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Split from `oversized` on purpose: a forged envelope is someone
              # probing the seal, and it should page differently from a large frame.
              expr: 'sum by (reason) (increase(stateless_relay_dropped_total{reason=~"type-not-allowed|broadcast-frame"}[10m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: realtime-doc-persist-fallback
        title: Document persist queue-fallback active (Redis/queue degraded)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Document saves are bypassing BullMQ and writing directly to Postgres on the WS event loop (document_persist_fallback_total rising for 10m). Sustained fallback means Redis/the store queue needs attention, not the DB.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Any sustained fallback is a degradation signal: the store hook
              # only falls back when the enqueue fails under a held redlock. A
              # single blip rolls through the 5m rate window in <10m and the
              # `for` clause suppresses it; a Redis outage holds rate>0 and pages.
              expr: 'sum(rate(document_persist_fallback_total[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: realtime-ws-mass-drop
        title: WS connections mass-drop (halved vs 5m ago)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'WS connections halved vs 5m ago. LOWER-CONFIDENCE: tune the >20 floor and 0.5 ratio after baselining concurrency.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: '(ws_active_connections offset 5m > 20) and (ws_active_connections < ws_active_connections offset 5m * 0.5)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
