apiVersion: 1
groups:
  - orgId: 1
    name: pipeline-liveness
    folder: docs.plus
    interval: 1m
    rules:
      - uid: pipeline-loki-liveness
        title: No app logs ingested (Loki/Alloy pipeline)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: No app logs ingested for ~15m — Loki/Alloy pipeline may be down (the log alerts fail green otherwise).
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # traefik + hocuspocus log continuously in prod; rest-api/webapp are too
              # quiet and age out, so scoping to the always-on services avoids false fires.
              expr: 'absent_over_time({service=~"traefik|hocuspocus.+"}[15m])'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: ops-deadman
        title: Deadman heartbeat
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          deadman: 'true'
        annotations:
          summary: Deadman heartbeat. If this STOPS reaching the external snitch, the alert pipeline is down.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'vector(1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # A size-cap deletion or a failed compaction drops history that before-and-after reads need (#749).
      - uid: prometheus-tsdb-loss
        title: Prometheus deleted or failed to compact history
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Prometheus history is at risk. Check disk with df -h / and the size cap in prometheus.yml before the next before-and-after read.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(increase(prometheus_tsdb_size_retentions_total{job="prometheus"}[1h])) + sum(increase(prometheus_tsdb_compactions_failed_total{job="prometheus"}[1h]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # Prometheus counts WAL and head chunks against the size cap, so the ratio counts them too.
      - uid: prometheus-tsdb-near-cap
        title: Prometheus history is near its size cap
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Prometheus history is at risk. Check disk with df -h / and the size cap in prometheus.yml before the next before-and-after read.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: '(max(prometheus_tsdb_storage_blocks_bytes{job="prometheus"}) + max(prometheus_tsdb_wal_storage_size_bytes{job="prometheus"}) + max(prometheus_tsdb_head_chunks_storage_size_bytes{job="prometheus"})) / max(prometheus_tsdb_retention_limit_bytes{job="prometheus"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }
              refId: C
