apiVersion: 1
groups:
  - orgId: 1
    name: slo-app
    folder: docs.plus
    interval: 1m
    rules:
      - uid: slo-http-5xx-ratio
        title: REST API 5xx ratio (>5%)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: REST API 5xx ratio >5% for 10m. Health probes and /metrics are left out, and the rule needs 20 or more requests in 10m.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # The WS process has timed its internal :4003 app since 2026-09-05, but REST is its
              # only caller and already counts the outer request, so the rule stays on rest-api.
              # Probes were 92.8% of requests (#710). Under 20 real requests, 1 error tops 5%,
              # so the guard drops those windows to no data.
              expr: '(sum by (job) (rate(http_requests_total{job="rest-api",status=~"5..",route!~"/health.*|/metrics"}[5m])) / sum by (job) (rate(http_requests_total{job="rest-api",route!~"/health.*|/metrics"}[5m]))) and on() (sum(increase(http_requests_total{job="rest-api",route!~"/health.*|/metrics"}[10m])) >= 20)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C

      - uid: slo-latency-p95-app
        title: App request p95 latency (>1s)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: REST API request p95 latency above 1s for 10m. Health probes, /metrics and /api/mcp are left out.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # rest-api and no probes, same reasons as slo-http-5xx-ratio. /api/mcp runs at
              # seconds per call and alone fired this rule on 2026-11-09, so it has its own rule.
              expr: 'histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket{job="rest-api",route!~"/health.*|/metrics|/api/mcp"}[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C

      - uid: slo-latency-p95-mcp
        title: MCP request p95 latency (>5s)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'REST /api/mcp request p95 latency above 5s for 10m.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # The 5s bar was ruled on 2026-11-11 (#710). #726 rechecks it after its after-session.
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="rest-api",route="/api/mcp"}[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
              refId: C

      - uid: slo-latency-p95-edge
        title: Edge (Traefik) p95 latency (>1.5s)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Traefik p95 latency for {{ $labels.service }} above 1.5s for 10m'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              # Only the API and webapp, one series each: pooled GlitchTip traffic hid a slow
              # API (#710). The allow-list leaves out hocuspocus, whose WebSocket duration is the
              # socket's lifetime. Confirm the #726 MCP service name matches .*mcp.* once it ships.
              expr: 'histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service=~"rest-api.*|webapp.*",service!~".*mcp.*"}[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1.5] }
              refId: C

      - uid: slo-eventloop-lag
        title: Node.js event-loop p99 lag (>100ms)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Node.js event-loop p99 lag above 100ms for 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max by (job) (nodejs_eventloop_lag_p99_seconds{job=~"rest-api|hocuspocus-server|hocuspocus-worker"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.1] }
              refId: C

      # A failed card answers a 302 to the Fallback card, never a 5xx, so slo-http-5xx-ratio
      # cannot see it. These two read the card's own counters instead. A failed member read
      # still draws the card, with no count, so it also shows up only here.
      - uid: social-card-errors
        title: Social card failures (>3 in 15m)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than 3 social card reads failed in 15m. A request error is a failed row read or render, and the crawler got the Fallback card (search the rest-api logs for "social card failed"). A chat read timeout or error sent a Chat or Message link to the Fallback card, or drew a Heading card without its chat chip. A member read timeout or error drew the card with no people row, because the member read gave no number. For both reads, check Supabase.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: '(sum(increase(social_card_requests_total{outcome="error"}[15m])) or vector(0)) + (sum(increase(social_card_chat_reads_total{outcome=~"timeout|error"}[15m])) or vector(0)) + (sum(increase(social_card_member_reads_total{outcome=~"timeout|error"}[15m])) or vector(0))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: C

      - uid: social-card-shed
        title: Social card shed a request (last 1h)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'A social card request was shed to the Fallback card ({{ $labels.outcome }}). slot-shed means the render queue (`createRenderSlot` in social-card/http/router.ts) was full. chat-shed means the chat read cap (`CHAT_READS_IN_FLIGHT`) was full. See the "Social preview card" row on App Performance.'
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum by (outcome) (increase(social_card_requests_total{outcome=~"chat-shed|slot-shed"}[1h]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
