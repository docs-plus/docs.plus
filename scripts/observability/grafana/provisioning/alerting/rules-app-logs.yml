apiVersion: 1
groups:
  - orgId: 1
    name: incident-logs
    folder: docs.plus
    interval: 1m
    rules:
      - uid: incident-failed-migration
        title: Failed migration (Prisma P3009)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Prisma migration error P3009 seen in rest-api/hocuspocus logs
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'count_over_time({service=~"rest-api|hocuspocus.+"} |= "P3009" [10m])'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-upload-drift
        title: Upload/config drift (PayloadTooLarge)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: PayloadTooLargeError or "exceeds maximum 0.00MB" in logs (upload size misconfig)
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # Scope to upload-handling app services only. A bare {service=~".+"}
              # self-fires: Grafana/Loki log this very query, Alloy re-ingests it,
              # and the rule then matches its own "PayloadTooLargeError" footprint.
              expr: 'count_over_time({service=~"rest-api|hocuspocus.+|webapp"} |~ "PayloadTooLargeError|exceeds maximum 0.00MB" [10m])'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-error-surge
        title: Error surge (level=50 rate)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Sustained error-log rate above 5/s (level=50); tune threshold after baseline
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(rate({service=~"rest-api|hocuspocus.+|webapp", level="50"} [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
              refId: C

      - uid: incident-email-broken
        title: Email broken (SMTP 535/EAUTH)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'SMTP auth failure (5xx / EAUTH) in hocuspocus logs. Transient 4xx throttles are already excluded, so this is a real credential or provider failure.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#email'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # nodemailer stamps EAUTH on both a permanent 535 and a transient 454, so
              # exclude the transient class rather than requiring the permanent one: a
              # connection-level EAUTH carries no responseCode at all, and `>= 500` drops
              # it, so a real credential failure would never page. Aggregated so a replaced
              # container leaves no orphan instance, `or vector(0)` so quiet reads 0.
              expr: 'sum(count_over_time({service=~"hocuspocus.+"} | json | err_code = "EAUTH" | err_responseCode !~ "4.." [10m])) or vector(0)'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-email-config-invalid
        title: Email config invalid (mail waiting)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'The email config is invalid, so no mail is sent and pgmq email messages wait. The log line lists each problem. Fix the host env file, then redeploy.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#email'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # The worker repeats this line every 5 min while mail is held, so a
              # 10 min window always sees it. rest-api logs it once at boot.
              expr: 'sum(count_over_time({service=~"rest-api|hocuspocus.+"} |= "email config invalid" [10m])) or vector(0)'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-email-operator
        title: Email send needs operator action
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'A send, or the boot connection check, failed with an error only an operator can fix: a bad key, an unverified From domain, or a used-up quota. A failed send skips its retries and goes to the dead-letter queue. Fix the cause, then run scripts/drain-email-dlq.ts.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#email'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # Any line counts, so the boot connection check pages too. A
              # duplicate line changes nothing at > 0.
              expr: 'sum(count_over_time({service=~"rest-api|hocuspocus.+"} | json | err_kind = "operator" [10m])) or vector(0)'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: incident-email-transient-surge
        title: Email transient failures
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '3 or more email sends failed with a transient error in 15 min. The jobs retry for about 15 min, so check the provider status. Raise the threshold when volume passes 500 mails a day.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#email'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # Anchored on the one line deliverEmail writes per failed send, so
              # each failure counts once.
              expr: 'sum(count_over_time({service=~"rest-api|hocuspocus.+"} |= "Email send failed" | json | err_kind = "transient" [15m])) or vector(0)'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C

      - uid: incident-email-webhook-unauthorized
        title: Email webhook signature failures
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'More than 50 requests to the Resend webhook failed the signature check in 10 min. The reason field says malformed, expired or mismatch. Many mismatches after a secret rotation mean the host env file still holds the old RESEND_WEBHOOK_SECRET.'
          runbook_url: 'https://github.com/docs-plus/docs.plus/blob/main/docs/RUNBOOK-backend.md#email'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # Only rest-api serves the webhook. A few rejections are noise from
              # scanners; a steady stream means a wrong secret or an attack.
              expr: 'sum(count_over_time({service="rest-api"} |= "email webhook signature rejected" [10m])) or vector(0)'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [50] }
              refId: C
