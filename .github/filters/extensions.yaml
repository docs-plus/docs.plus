# Shared inputs for ALL extensions, appended to every key via YAML anchor.
# scripts/check-ci.ts reads this file. Dist inputs are also in build-extensions hashFiles.
# Test-only entries (playground, run-tests.sh, setup-cypress, the quickstart check,
# the workflow, this folder) run the suites but need no cache bust: dist is unchanged.
_shared: &shared
  - 'package.json'
  - 'bun.lock'
  - 'tsconfig.base.json'
  - 'tsup.base.ts'
  - 'packages/floating-popover/**'
  - 'packages/floating-tooltip/**'
  - '.github/actions/build-extensions/**'
  - '.github/actions/setup-cypress/**'
  # Resolves the Bun version and runs the frozen-lockfile install for every ext job.
  - '.github/actions/setup-bun/**'
  - 'packages/playground/**'
  - 'scripts/publishable-extensions.ts'
  - 'scripts/build-extensions.sh'
  - 'scripts/run-tests.sh'
  - 'scripts/extension-preflight.sh'
  # extension-preflight.sh runs it to compare each README Quickstart with examples/vanilla.
  - 'scripts/check-quickstart-example.ts'
  # extension-preflight.sh runs it on packages that keep PURE comments (#774).
  - 'scripts/check-pure-annotations.ts'
  # The workflow that runs these suites, and this filter.
  - '.github/workflows/prod.docs.plus.yml'
  - '.github/filters/**'
  # Implements `release-preflight`, which every extension's prepublishOnly runs.
  - 'packages/release-tooling/**'

# README media: no suite, build or preflight reads it. The step sets
# predicate-quantifier: 'some-with-excludes', so a '!' rule is final for its key.
# README.md, CHANGELOG.md and package.json stay in, because the preflight reads them.
_readme_media: &readme_media
  - '!extensions/*/assets/**'
  - '!extensions/*/*.{gif,png,jpg,jpeg,webp,mp4}'

extension-indent:
  - *shared
  - *readme_media
  - 'extensions/extension-indent/**'
extension-hyperlink:
  - *shared
  - *readme_media
  - 'extensions/extension-hyperlink/**'
extension-hypermultimedia:
  - *shared
  - *readme_media
  - 'extensions/extension-hypermultimedia/**'
  # Its playground imports extension-hyperlink, and linked-image.cy.ts tests that pair.
  - 'extensions/extension-hyperlink/**'
extension-inline-code:
  - *shared
  - *readme_media
  - 'extensions/extension-inline-code/**'
extension-placeholder:
  - *shared
  - *readme_media
  - 'extensions/extension-placeholder/**'
extension-mermaid:
  - *shared
  - *readme_media
  - 'extensions/extension-mermaid/**'
