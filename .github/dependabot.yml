# Dependabot does not do security updates for the `bun` ecosystem, only version
# updates. `bun audit` in prod.docs.plus.yml stays the detector for advisories.
version: 2
updates:
  # Every third-party action is SHA-pinned; this is what bumps the pins.
  # `directory: /` reads .github/workflows only, so the composite actions under
  # .github/actions each need their own entry, hence the glob. It covers all
  # three: build-extensions, setup-bun and setup-cypress each hold an action.yml.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5

  # One `bun.lock` at the root. A per-workspace directory list opened a second
  # PR per package that bumped package.json and left the lockfile stale, so
  # `bun install --frozen-lockfile` failed. The root entry covers the workspace.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5
    groups:
      # Majors stay ungrouped so each one is its own review. The 2026-08-22
      # pile (#182) mixed Babel 8, TypeScript 7, Prisma 7, and Next 16.3.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'eslint-config-next'
    ignore:
      # Exact-pinned on purpose: these parse untrusted input, and the pin is the
      # boundary. Bump them by hand, with the verification the pin's note names.
      - dependency-name: '@turbodocx/html-to-docx'
      - dependency-name: 'mammoth'
      - dependency-name: 'linkedom'
      # The metascraper family is pinned to 5.50.6 because 5.51.1 crashes REST
      # startup on Bun. AGENTS.md holds the exit condition.
      - dependency-name: 'metascraper'
      - dependency-name: 'metascraper-*'
      - dependency-name: '@metascraper/*'
      # Parked majors. eslint-config-next 16.3 is issue #172. TypeScript 7,
      # Prisma 7, and Babel 8 each need their own migration.
      - dependency-name: 'eslint-config-next'
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
