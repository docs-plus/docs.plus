name: Quality Lint

# Shared lint/format/style gate for stage and prod pipelines.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Setup Environment
        uses: ./.github/actions/setup-bun

      - name: 🔍 Lint, format & styles
        run: |
          bun run lint
          bun run format
          bun run lint:styles
