name: Editor Browser Tests

# Runs beside the deploy, not as a gate (#477 ruling, 2026-10-24).
# No deployment or database credentials are used by this isolated suite.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/webapp/**'
      - 'extensions/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/editor-e2e.yml'
      - 'package.json'
      - 'bun.lock'
      - '*config*'

permissions:
  contents: read

concurrency:
  group: editor-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Editor E2E
    runs-on: ubuntu-latest
    # A local run took about 10 minutes, build plus suite (#477). CI runners are slower.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.2'
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-cypress
      - name: Run the isolated editor browser suite
        run: bash scripts/test-editor.sh
      - name: Retain results and failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-e2e-${{ github.run_id }}
          include-hidden-files: true
          path: |
            Notes/test-results-*.txt
            Notes/.e2e-logs-*/
            Notes/editor-server.log
            apps/webapp/cypress/screenshots/
          retention-days: 7
      - name: 📣 Notify editor E2E failure
        if: failure() && github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/ci/notify-telegram.sh - \
            "🧪 Editor E2E FAILED on main (${GITHUB_SHA::9}): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
