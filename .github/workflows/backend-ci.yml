name: Backend CI

# Pull requests run the backend suites without services.
# Production build triggers also run E2E against Postgres and Redis.
on:
  workflow_call:
    inputs:
      run_e2e:
        description: Run the Postgres and Redis E2E suites
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Setup Environment
        uses: ./.github/actions/setup-bun

      # migration-extensions.ts imports built extension dist; build the two it
      # needs (plus their floating-popover/floating-tooltip deps, which the
      # action builds first) so the src/lib migration suite resolves them.
      - name: 🔧 Build Migration Extensions
        uses: ./.github/actions/build-extensions
        with:
          extensions: extension-hyperlink extension-hypermultimedia extension-inline-code

      # No-infra gate: every backend suite is mock-based (createMockPrisma/Redis),
      # so unit + lib + link-metadata + integration all run without Postgres/Redis.
      # The package `test` script is a bare `bun test` — an enumerated path list
      # silently dropped a whole `__tests__/integration` directory from this gate.
      - name: 🧪 Run Backend Tests
        working-directory: apps/hocuspocus.server
        run: bun run test

  backend-e2e:
    if: inputs.run_e2e
    name: 🧪 Backend E2E (real Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hocuspocus_e2e_test
          POSTGRES_USER: docsplus
          POSTGRES_PASSWORD: e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://docsplus:e2e_password@localhost:5432/hocuspocus_e2e_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '15'
      # The Supabase stub started below (#586).
      SUPABASE_URL: http://127.0.0.1:54399
      # A failed test user mint fails the step and prints why, instead of a skip.
      E2E_REQUIRE_AUTH: '1'
      SUPABASE_ANON_KEY: dummy
      # The content-inject E2E boots both entrypoints and drives the
      # service-role content routes, which fail closed without a key.
      SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key
      JWT_SECRET: e2e-jwt-secret
      ALLOWED_ORIGINS: http://localhost
      NODE_ENV: development
      LOG_LEVEL: silent
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🥟 Setup Environment
        uses: ./.github/actions/setup-bun

      # The content-inject E2E boots the real REST and WS entrypoints, which
      # load migration-extensions.ts and therefore the built extension dist.
      - name: 🔧 Build Migration Extensions
        uses: ./.github/actions/build-extensions
        with:
          extensions: extension-hyperlink extension-hypermultimedia extension-inline-code

      - name: 🗄️ Apply migrations to the E2E database
        working-directory: apps/hocuspocus.server
        run: bunx prisma migrate deploy --schema ./prisma/schema.prisma

      # The signed-in E2E steps below (document versions, change attribution,
      # document changes, first-edit owner) use this stub. It serves Auth user
      # create, sign-in, token check and delete, and GET /rest/v1/users. Any other
      # Supabase path answers 404.
      - name: 🔑 Start the Supabase stub
        working-directory: apps/hocuspocus.server
        run: |
          nohup bun scripts/lib/supabaseStub.ts > /tmp/supabase-stub.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf "$SUPABASE_URL/rest/v1/users" > /dev/null && exit 0
            sleep 0.2
          done
          exit 1

      - name: 🧪 Run real-infra E2E (service CRUD + store pipeline)
        working-directory: apps/hocuspocus.server
        run: bun run test:e2e

      # Needs only Redis. Section [1] spawns two child processes, which is the
      # replica condition the retention lease exists for, and every check here
      # carries a control so a pass proves the mechanism fired.
      - name: 🧪 Run real-infra E2E (fleet-wide limits)
        working-directory: apps/hocuspocus.server
        run: bun run test:e2e:limits

      # The script's `--env-file=../../.env.local` is a local-dev convenience;
      # Bun ignores a missing env file, so CI runs it on the job env above.
      - name: 🧪 Run real-infra E2E (document content injection)
        working-directory: apps/hocuspocus.server
        run: bun run test:e2e:content-inject

      # The user-identity and read-only checks sign in through the stub.
      - name: 🧪 Run real-infra E2E (document versions)
        working-directory: apps/hocuspocus.server
        run: bun --env-file=../../.env.local scripts/e2e-versions.ts

      # The signed-out checks need no Auth. The signed-in checks sign in
      # through the stub.
      - name: 🧪 Run real-infra E2E (change attribution)
        working-directory: apps/hocuspocus.server
        run: bun run test:e2e:change-attribution

      # Contributor names come from the stub's users table. Trigger counts
      # read Postgres. The timing skip ("predecessor millisecond") is not Auth.
      - name: 🧪 Run real-infra E2E (document changes)
        working-directory: apps/hocuspocus.server
        run: bun run test:e2e:document-changes

      # All four cases assert here: the signed-out case needs no Auth, and the
      # signed-in owner, cede and backstop cases sign in through the stub.
      - name: 🧪 Run real-infra E2E (first-edit owner)
        working-directory: apps/hocuspocus.server
        run: bun --env-file=../../.env.local scripts/e2e-first-edit-owner.ts

      - name: 📋 Show the Supabase stub log
        if: always()
        run: cat /tmp/supabase-stub.log || true
