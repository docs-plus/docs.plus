# Server-only observability stack deploy. Decoupled from the app's blue-green
# release: no quality-gate dependency and outside the app deploy concurrency
# group — deliberate (the self-hosted runner serializes jobs).
name: CI/CD Observability

on:
  workflow_call:
    inputs:
      action:
        required: false
        default: setup
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run on the stack'
        required: true
        default: setup
        type: choice
        options: [setup, update, restart, down]

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.observability.yml
  ENV_SOURCE: /opt/projects/prod.docs.plus/.env.observability
  ENV_FILE: .env.observability

jobs:
  deploy:
    name: 🔭 Deploy Observability
    runs-on: prod.docs.plus
    timeout-minutes: 15
    concurrency:
      group: observability-deploy
      cancel-in-progress: false
    # Gate on the action input, NOT github.event_name: inside workflow_call that is
    # the CALLER's event ('push'), so an event check skipped every orchestrated deploy.
    # github.ref is the caller's ref too, so the push to main still runs, and a
    # dispatch from any other branch skips (#437).
    if: github.ref == 'refs/heads/main' && inputs.action != 'down'
    # No `environment: production`. It has no protection rules today (2026-10-20),
    # but any rule added to it later would also gate every monitoring deploy.
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🔐 Prepare environment
        run: |
          cp "${ENV_SOURCE}" "${ENV_FILE}"
          # Require a real first character: dotenv strips quotes, so KEY="" or
          # whitespace-only values are empty at runtime and must fail here.
          for k in GRAFANA_ADMIN_PASSWORD GLITCHTIP_SECRET_KEY GLITCHTIP_POSTGRES_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID DATABASE_URL DEADMAN_WEBHOOK_URL REDIS_PASSWORD; do
            if ! grep -Eq "^${k}=[\"']?[^\"'[:space:]]" "${ENV_FILE}"; then
              echo "::error::${k} missing or empty in ${ENV_SOURCE}"; exit 1
            fi
          done
          echo "✅ Environment ready"

      - name: 📨 Render Telegram contact point
        # Grafana's native ${VAR} expansion in alerting provisioning mistypes a numeric
        # chat id (-100…) into a JSON number and fails to load; envsubst renders a literal
        # quoted string instead. Only the allowlisted vars are substituted so the Go
        # message template and the LogQL/PromQL `$` in rules-*.yml are left intact.
        run: |
          set -a
          # shellcheck disable=SC1090
          . "./${ENV_FILE}"
          set +a
          # Warnings route falls back to the main ops chat until a dedicated one is set.
          : "${TELEGRAM_WARNINGS_CHAT_ID:=${TELEGRAM_CHAT_ID}}"
          export TELEGRAM_WARNINGS_CHAT_ID
          # shellcheck disable=SC2016
          envsubst '${TELEGRAM_BOT_TOKEN} ${TELEGRAM_CHAT_ID} ${TELEGRAM_WARNINGS_CHAT_ID} ${DEADMAN_WEBHOOK_URL}' \
            < scripts/observability/grafana/provisioning/alerting/contactpoints.yml.tmpl \
            > scripts/observability/grafana/provisioning/alerting/contactpoints.yml

      - name: 💾 Disk guard
        run: |
          AVAIL_GB=$(( $(df --output=avail / | tail -1) / 1024 / 1024 ))
          echo "📊 ${AVAIL_GB} GB free on /"
          if [ "${AVAIL_GB}" -lt 10 ]; then
            echo "::error::Less than 10 GB free on /. Aborting."; df -h /; exit 1
          fi

      - name: 🔧 Ensure network
        run: docker network create docsplus-network 2>/dev/null || true

      - name: 🧪 Check Grafana provisioning
        # A broken rule file makes Grafana exit at start and loop, so load the tree in a
        # throwaway container first (#753). No network and no alert execution: the
        # rendered contact points hold the real Telegram token.
        run: |
          for f in scripts/observability/grafana/provisioning/dashboards/json/*.json; do
            # python3, not jq: the runner host has no jq (read 2026-11-12).
            python3 -m json.tool "$f" >/dev/null || { echo "::error::dashboard JSON does not parse: $f"; exit 1; }
          done
          img=$(docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" config --images | grep '^grafana/grafana:')
          docker rm -fv grafana-provision-check >/dev/null 2>&1 || true
          # No --rm, so a crashed container keeps its logs until the final rm -fv.
          docker run -d --name grafana-provision-check --network none -e GF_UNIFIED_ALERTING_EXECUTE_ALERTS=false \
            -e GF_SECURITY_ADMIN_PASSWORD=provision-check \
            -v "${PWD}/scripts/observability/grafana/provisioning:/etc/grafana/provisioning:ro" "${img}" >/dev/null
          ok=0
          for _i in $(seq 1 24); do
            if docker exec grafana-provision-check wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q ok; then ok=1; break; fi
            sleep 5
          done
          want=$(cat scripts/observability/grafana/provisioning/alerting/rules-*.yml | grep -cE '^      - uid:')
          got=0
          # Health ok can come before alert provisioning ends, so retry the count.
          for _i in $(seq 1 6); do
            got=$(docker exec grafana-provision-check sh -c 'printf "user = \"admin:%s\"\n" "$GF_SECURITY_ADMIN_PASSWORD" | curl -sfK - http://localhost:3000/api/v1/provisioning/alert-rules' | grep -o '"ruleGroup":"' | wc -l || true)
            [ "${got}" -eq "${want}" ] && break
            sleep 5
          done
          docker logs grafana-provision-check 2>&1 | grep -iE 'provision|invalid' | tail -5 || true
          docker rm -fv grafana-provision-check >/dev/null 2>&1 || true
          [ "${ok}" = 1 ] || { echo "::error::Grafana did not start on the new provisioning"; exit 1; }
          [ "${got}" -eq "${want}" ] || { echo "::error::Grafana loaded ${got} of ${want} rules"; exit 1; }
          echo "✅ Grafana provisioning loads: got = want = ${want}"

      - name: 🚀 Deploy stack
        env:
          ACTION_IN: ${{ inputs.action }}
        run: |
          ACTION="${ACTION_IN:-setup}"
          case "${ACTION}" in
            setup|update|restart|down) ;;
            *) echo "::error::unknown observability action '${ACTION}'"; exit 1 ;;
          esac
          case "${ACTION}" in
            restart)
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" restart ;;
            *)
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" pull
              # Validate the mounted config before touching the running stack.
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" \
                run --rm --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --remove-orphans
              # `up -d` never re-reads bind-mounted config files on unchanged containers;
              # restart forces prometheus.yml + grafana provisioning to be picked up.
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" restart prometheus grafana ;;
          esac

      - name: 🩺 Verify
        run: |
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps
          # A failed probe inside an && list never exits bash, so each check ends in exit 1 (#753).
          ok=0
          for _i in $(seq 1 18); do
            if docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T grafana wget -qO- http://localhost:3000/api/health 2>/dev/null | grep -q ok; then ok=1; echo "✅ grafana healthy"; break; fi
            sleep 5
          done
          [ "${ok}" = 1 ] || { echo "::error::grafana not healthy after ~90s"; exit 1; }
          want=$(cat scripts/observability/grafana/provisioning/alerting/rules-*.yml | grep -cE '^      - uid:')
          got=0
          for _i in $(seq 1 6); do
            got=$(docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T grafana sh -c 'printf "user = \"admin:%s\"\n" "$GF_SECURITY_ADMIN_PASSWORD" | curl -sfK - http://localhost:3000/api/v1/provisioning/alert-rules' | grep -o '"ruleGroup":"' | wc -l || true)
            [ "${got}" -eq "${want}" ] && break
            sleep 5
          done
          [ "${got}" -eq "${want}" ] || { echo "::error::live Grafana has ${got} of ${want} rules"; exit 1; }
          # Loki and Prometheus may restart in this deploy (#712, #749). Wait up to 60 s for both data sources, then go on.
          for _i in $(seq 1 12); do
            docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T grafana sh -c 'for u in loki prometheus; do printf "user = \"admin:%s\"\n" "$GF_SECURITY_ADMIN_PASSWORD" | curl -sfK - "http://localhost:3000/api/datasources/uid/$u/health" || exit 1; done' >/dev/null 2>&1 && break
            sleep 5
          done
          # Two 1-minute evaluations, so a broken expr reaches error health.
          # A rule that errors because a data source is down fails too (ruling 2026-11-11).
          sleep 150
          rules=$(docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T grafana sh -c 'printf "user = \"admin:%s\"\n" "$GF_SECURITY_ADMIN_PASSWORD" | curl -sfK - http://localhost:3000/api/prometheus/grafana/api/v1/rules') || { echo "::error::could not read Grafana rule health"; exit 1; }
          bad=$(printf '%s' "${rules}" | python3 -c 'import json, sys
          for g in json.load(sys.stdin)["data"]["groups"]:
              for r in g["rules"]:
                  if r.get("health") == "error":
                      print(r.get("uid") or r.get("name"), r.get("lastError") or "")') || { echo "::error::could not parse Grafana rule health"; exit 1; }
          errs=$(printf '%s' "${bad}" | grep -c . || true)
          echo "want=${want} got=${got} error_health=${errs}"
          [ -z "${bad}" ] || { printf '%s\n' "${bad}" | while read -r line; do echo "::error::rule in error health: ${line}"; done; exit 1; }
          # GlitchTip cold-boots + migrates and ships no wget/curl (only python3) — poll up to ~90s.
          ok=0
          for _i in $(seq 1 18); do
            if docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" exec -T glitchtip-web \
                 python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8080/_health/").status==200 else 1)' 2>/dev/null; then
              ok=1; echo "✅ glitchtip healthy"; break
            fi
            sleep 5
          done
          [ "${ok}" = 1 ] || { echo "::error::glitchtip-web not healthy after ~90s"; exit 1; }

      - name: 📣 Notify failure
        if: failure()
        # Reads ENV_SOURCE (not the copied file) — the copy step itself may be what failed.
        run: bash scripts/ci/notify-telegram.sh "${ENV_SOURCE}" "🔭 Observability deploy FAILED (${GITHUB_SHA}, run ${GITHUB_RUN_ID})"

  teardown:
    name: 🧹 Down
    runs-on: prod.docs.plus
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'down'
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔐 Prepare environment
        run: cp "${ENV_SOURCE}" "${ENV_FILE}"
      - name: 🧹 Down (keep volumes)
        run: docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" down
