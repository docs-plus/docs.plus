# ============================================================================
# Composite Action: Setup Cypress Binary
# ============================================================================
# Cypress ships as an npm wrapper; the Linux runner binary lives in
# ~/.cache/Cypress. setup-bun caches node_modules only, so extension E2E
# needs this step before `bunx cypress run`.
#
# CRITICAL: the install MUST run from inside an extension workspace, not the
# repo root. `bunx cypress` resolves the locally installed version only when one
# is on the path; the repo root has no `cypress` dep, so bunx fetches
# cypress@latest (e.g. 15.17.0), installs that binary, and even rewrites
# bun.lock — while the suites run the catalog-pinned version (15.15.0) and
# report its binary as missing. From an extension dir bunx resolves the pinned
# version and installs the matching binary. Verified: `bunx cypress --version`
# is 15.17.0 at root vs 15.15.0 from extensions/extension-hyperlink.
# ============================================================================

name: 'Setup Cypress Binary'
description: 'Cache and install the Cypress test runner binary'

runs:
  using: 'composite'
  steps:
    # Keyed on the installed version, not bun.lock: most lock changes keep the
    # same binary. Needs setup-bun first, so node_modules holds the pinned cypress.
    - name: 🏷️ Read Cypress version
      id: version
      shell: bash
      working-directory: extensions/extension-hyperlink
      run: |
        version=$(bun -e "console.log(require('cypress/package.json').version)")
        [ -n "$version" ] || { echo "::error::cypress is not installed; run setup-bun first"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # No restore-keys: a prefix hit restores the old binary, and the save then
    # stores both versions in one entry.
    - name: 📦 Restore Cypress binary
      id: cypress-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ steps.version.outputs.version }}

    - name: 🌲 Install Cypress binary
      shell: bash
      working-directory: extensions/extension-hyperlink
      run: |
        if [ "${{ steps.cypress-cache.outputs.cache-hit }}" = "true" ]; then
          echo "✅ Cypress cache HIT"
        else
          echo "📦 Downloading Cypress binary…"
        fi
        bunx cypress install
        bunx cypress verify

    # Pull requests read main's entries and never save. The lookup skips a key
    # that another job already saved.
    - name: 🔎 Look up saved Cypress binary
      id: lookup
      if: github.event_name != 'pull_request' && steps.cypress-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: ${{ steps.cypress-cache.outputs.cache-primary-key }}
        lookup-only: true

    - name: 💾 Save Cypress binary
      if: steps.lookup.outcome == 'success' && steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: ${{ steps.cypress-cache.outputs.cache-primary-key }}
