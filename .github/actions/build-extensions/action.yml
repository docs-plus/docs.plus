# Package list: scripts/publishable-extensions.ts → scripts/build-extensions.sh
name: 'Build Extension Dist'
description: 'Restore extension dist cache; build on cache miss'

inputs:
  extensions:
    description: 'Space-separated extension dir names to build; empty = all five'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the extension dist cache was restored'
    value: ${{ steps.cache-ext.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # The cache stores all five dists but the build step only builds `EXT_ONLY`,
    # so a scoped run must not save under the same key as a full one — a later
    # exact hit would skip the build and serve stale dist for the rest.
    # Normalised because callers pass multi-name lists (backend-ci passes three).
    - name: 🏷️ Resolve cache scope
      id: scope
      shell: bash
      env:
        EXT_ONLY: ${{ inputs.extensions }}
      run: echo "key=$(echo "${EXT_ONLY:-all}" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - name: 📦 Restore extension build cache
      id: cache-ext
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        # Dist-affecting inputs — keep hashFiles in sync with the dist subset
        # documented in .github/filters/extensions.yaml (tsup/tsconfig, floating
        # src, extension src, build orchestration). Key prefix ext-v3 busts caches
        # that predate tsup/tsconfig/build-script hashing.
        path: |
          extensions/*/dist
          packages/floating-popover/dist
          packages/floating-tooltip/dist
        key: ext-v3-${{ runner.os }}-${{ steps.scope.outputs.key }}-${{ hashFiles('bun.lock',
          'tsup.base.ts',
          'tsconfig.base.json',
          'scripts/build-extensions.sh',
          'scripts/publishable-extensions.ts',
          'packages/floating-popover/package.json',
          'packages/floating-popover/src/**',
          'packages/floating-tooltip/package.json',
          'packages/floating-tooltip/src/**',
          'extensions/*/package.json',
          'extensions/*/src/**') }}
        restore-keys: ext-v3-${{ runner.os }}-

    - name: 🔧 Build extensions
      if: steps.cache-ext.outputs.cache-hit != 'true'
      shell: bash
      env:
        EXT_ONLY: ${{ inputs.extensions }}
      run: bash scripts/build-extensions.sh
