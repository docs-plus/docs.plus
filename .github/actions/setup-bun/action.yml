# ============================================================================
# Composite Action: Setup Bun Environment
# ============================================================================
# Reusable Bun setup with caching. Key invalidates on bun.lock changes.
# Increment cache-version to manually bust cache when needed.
# ============================================================================

name: 'Setup Bun Environment'
description: 'Setup Bun with cached dependencies'

inputs:
  bun-version:
    description: 'Bun version. Pinned on purpose; bump by hand, never below the 1.4.0 floor (AGENTS.md).'
    default: '1.4.1'
  ignore-scripts:
    description: 'Skip postinstall scripts (for security job)'
    default: 'false'
  cache-version:
    description: 'Increment to bust cache (v1, v2, etc)'
    default: 'v2'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: 🥟 Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    # One path list for restore, lookup and save. The cache version hashes it,
    # so a drifted copy would save entries that the restore never finds.
    - name: 🗂️ Set cache paths
      id: paths
      shell: bash
      run: |
        {
          echo 'list<<EOF'
          echo '~/.bun/install/cache'
          echo 'node_modules'
          echo 'packages/*/node_modules'
          echo 'apps/*/node_modules'
          echo 'extensions/*/node_modules'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: 📦 Restore Dependencies
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.list }}
        # The Bun version stays in the key: cached node_modules hold native addons
        # built for one Bun, and --frozen-lockfile relinks them without a rebuild.
        key: ${{ runner.os }}-bun-${{ inputs.cache-version }}-${{
          steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ inputs.cache-version }}-${{ steps.setup-bun.outputs.bun-version }}-

    - name: 📥 Install Dependencies
      shell: bash
      run: |
        [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && echo "✅ Cache HIT" || echo "📦 Installing..."
        bun install --frozen-lockfile ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}

    # Pull requests read main's entries and never save. An --ignore-scripts tree
    # must not become the shared entry. The lookup skips a key another job saved.
    - name: 🔎 Look up saved dependencies
      id: lookup
      if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true' && inputs.ignore-scripts != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.list }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
        lookup-only: true

    - name: 💾 Save Dependencies
      if: steps.lookup.outcome == 'success' && steps.lookup.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.list }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
