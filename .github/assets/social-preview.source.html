<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>docs.plus — Get everyone on the same page</title>
    <style>
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #f1f5fd;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        /* blue-white stock: the logo blue washed in low, the light corner blue high */
        background:
          radial-gradient(
            700px 560px at 8% 22%,
            rgba(255, 255, 255, 0.58),
            rgba(255, 255, 255, 0) 68%
          ),
          radial-gradient(
            640px 520px at 30% 112%,
            rgba(38, 120, 255, 0.11),
            rgba(38, 120, 255, 0) 62%
          ),
          radial-gradient(700px 460px at 98% 2%, rgba(26, 35, 126, 0.05), rgba(26, 35, 126, 0) 60%),
          #f1f5fd;
      }

      /* ---------- the sheet: one page, tilted, running off three edges ---------- */
      /* a second page under the first, so the stack reads as paper */
      .back {
        position: absolute;
        left: 600px;
        top: 84px;
        width: 880px;
        height: 690px;
        border-radius: 24px;
        background: #fafcff;
        border: 1px solid rgba(17, 32, 66, 0.06);
        box-shadow: 0 26px 52px -26px rgba(17, 32, 66, 0.26);
        transform: rotate(1.4deg);
      }

      .sheet {
        position: absolute;
        left: 582px;
        top: 78px;
        width: 900px;
        height: 700px;
        overflow: hidden;
        border-radius: 26px;
        background: #ffffff;
        border: 1px solid rgba(17, 32, 66, 0.06);
        box-shadow:
          0 48px 92px -30px rgba(17, 32, 66, 0.32),
          0 12px 26px -12px rgba(17, 32, 66, 0.1);
        transform: rotate(-2.6deg);
      }

      /* document chrome */
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 104px;
        border-bottom: 1px solid #eaf0f9;
      }
      .tab {
        position: absolute;
        top: 42px;
        height: 18px;
        border-radius: 9px;
      }
      .tab-1 {
        left: 64px;
        width: 190px;
        background: #d7e1f1;
      }
      .tab-2 {
        left: 274px;
        width: 108px;
        background: #e8eef8;
      }
      .tab-3 {
        left: 402px;
        width: 72px;
        background: #f2f6fc;
      }

      /* the room is open: a quiet live chip on the far side of the bar */
      .open {
        position: absolute;
        left: 520px;
        top: 32px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        height: 40px;
        border-radius: 20px;
        background: rgba(55, 128, 84, 0.1);
      }
      .open i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #378054;
      }
      .open u {
        width: 58px;
        height: 14px;
        border-radius: 7px;
        background: rgba(55, 128, 84, 0.38);
      }

      /* document body */
      .head-bar {
        position: absolute;
        left: 64px;
        top: 150px;
        width: 420px;
        height: 36px;
        border-radius: 18px;
        background: #101a2c;
      }
      .sub-bar {
        position: absolute;
        left: 64px;
        top: 360px;
        width: 270px;
        height: 28px;
        border-radius: 14px;
        background: #3b4759;
      }
      .line {
        position: absolute;
        left: 64px;
        height: 18px;
        border-radius: 9px;
        background: #e2e9f4;
      }
      .n1 {
        top: 222px;
        width: 700px;
      }
      .n2 {
        top: 262px;
        width: 656px;
      }
      .n3 {
        top: 302px;
        width: 690px;
      }
      .n4 {
        top: 416px;
        width: 686px;
      }
      .n5 {
        top: 456px;
        width: 700px;
      }
      .n6 {
        top: 496px;
        width: 620px;
      }
      .n7 {
        top: 536px;
        width: 690px;
      }
      .n8 {
        top: 576px;
        width: 560px;
      }

      /* two people hold a run of text, each in their own colour */
      .pick {
        position: absolute;
        height: 34px;
        border-radius: 9px;
      }
      .pick-ana {
        left: 350px;
        top: 214px;
        width: 210px;
        background: rgba(38, 120, 255, 0.16);
      }
      .pick-lena-1 {
        left: 300px;
        top: 448px;
        width: 400px;
        background: rgba(202, 53, 64, 0.19);
      }
      .pick-lena-2 {
        left: 64px;
        top: 488px;
        width: 300px;
        background: rgba(202, 53, 64, 0.19);
      }

      /* a cursor is a caret plus the name of the person holding it */
      .cursor {
        position: absolute;
        display: flex;
        align-items: center;
      }
      .caret {
        width: 7px;
        height: 34px;
        border-radius: 4px;
        flex: none;
      }
      .name {
        height: 30px;
        margin-left: 4px;
        padding: 0 11px;
        border-radius: 8px;
        border-top-left-radius: 3px;
        display: flex;
        align-items: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.004em;
        color: #ffffff;
        white-space: nowrap;
      }
      .cur-ana {
        left: 560px;
        top: 214px;
      }
      .cur-ana .caret,
      .cur-ana .name {
        background: #1a5fd0;
      }

      .cur-kofi {
        left: 300px;
        top: 254px;
      }
      .cur-kofi .caret,
      .cur-kofi .name {
        background: #378054;
      }

      .cur-ravi {
        left: 150px;
        top: 448px;
      }
      .cur-ravi .caret,
      .cur-ravi .name {
        background: #dc702f;
      }
      .cur-ravi .name {
        color: #101a2c;
      }

      .cur-mei {
        left: 500px;
        top: 408px;
      }
      .cur-mei .caret,
      .cur-mei .name {
        background: #ddb13a;
      }
      .cur-mei .name {
        color: #101a2c;
      }

      .cur-lena {
        left: 364px;
        top: 488px;
      }
      .cur-lena .caret,
      .cur-lena .name {
        background: #ca3540;
      }

      /* ---------- the message ---------- */
      .say {
        position: absolute;
        left: 72px;
        top: 46px;
        width: 470px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 34px;
      }
      .lockup img {
        display: block;
        margin-left: -13px;
      }
      .wordmark {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: #101a2c;
      }

      h1 {
        margin: 0;
        font-size: 60px;
        line-height: 1.06;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #101a2c;
      }
      .sub {
        margin: 24px 0 0;
        font-size: 34px;
        line-height: 1.3;
        font-weight: 450;
        letter-spacing: -0.006em;
        color: #5a6579;
      }
      .who {
        color: #1a5fd0;
        font-weight: 700;
      }

      /* ---------- the crowd: the stack is the loudest thing after the headline ---------- */
      .presence {
        position: absolute;
        left: 76px;
        top: 424px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .live {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        flex: none;
        background: #378054;
        box-shadow: 0 0 0 7px rgba(55, 128, 84, 0.15);
      }
      .presence p {
        margin: 0;
        font-size: 34px;
        font-weight: 450;
        letter-spacing: -0.004em;
        color: #5a6579;
        white-space: nowrap;
      }
      .presence b {
        color: #101a2c;
        font-weight: 700;
      }

      /* the stack runs off the paper and onto the sheet, so the two layers lock */
      .crowd {
        position: absolute;
        left: 72px;
        top: 496px;
        display: flex;
      }
      .face {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #ffffff;
        box-shadow:
          0 0 0 7px #f1f5fd,
          0 14px 26px -12px rgba(17, 32, 66, 0.34);
      }
      .face + .face {
        margin-left: -18px;
      }
      .f-ana {
        background: #1a5fd0;
      }
      .f-kofi {
        background: #378054;
      }
      .f-mei {
        background: #ddb13a;
        color: #101a2c;
      }
      .f-ravi {
        background: #dc702f;
        color: #101a2c;
      }
      .f-lena {
        background: #ca3540;
      }
      .more {
        background: #dae3f2;
        color: #3b4759;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="back"></div>

      <div class="sheet">
        <div class="bar">
          <div class="tab tab-1"></div>
          <div class="tab tab-2"></div>
          <div class="tab tab-3"></div>
          <div class="open">
            <i></i>
            <u></u>
          </div>
        </div>

        <div class="head-bar"></div>
        <div class="line n1"></div>
        <div class="line n2"></div>
        <div class="line n3"></div>

        <div class="sub-bar"></div>
        <div class="line n4"></div>
        <div class="line n5"></div>
        <div class="line n6"></div>
        <div class="line n7"></div>
        <div class="line n8"></div>

        <div class="pick pick-ana"></div>
        <div class="pick pick-lena-1"></div>
        <div class="pick pick-lena-2"></div>

        <div class="cursor cur-ana">
          <div class="caret"></div>
          <div class="name">Ana</div>
        </div>
        <div class="cursor cur-kofi">
          <div class="caret"></div>
          <div class="name">Kofi</div>
        </div>
        <div class="cursor cur-ravi">
          <div class="caret"></div>
          <div class="name">Ravi</div>
        </div>
        <div class="cursor cur-mei">
          <div class="caret"></div>
          <div class="name">Mei</div>
        </div>
        <div class="cursor cur-lena">
          <div class="caret"></div>
          <div class="name">Lena</div>
        </div>
      </div>

      <div class="say">
        <div class="lockup">
          <img src="social-preview.logo.svg" width="74" height="74" alt="" />
          <span class="wordmark">docs.plus</span>
        </div>
        <h1>
          Get everyone
          <br />
          on the same page
        </h1>
        <p class="sub">
          Free, open-source collaborative
          <br />
          documents for
          <span class="who">teams</span>
        </p>
      </div>

      <div class="presence">
        <span class="live"></span>
        <p>
          <b>7 people</b>
          here right now
        </p>
      </div>

      <div class="crowd">
        <div class="face f-ana">A</div>
        <div class="face f-kofi">K</div>
        <div class="face f-mei">M</div>
        <div class="face f-ravi">R</div>
        <div class="face f-lena">L</div>
        <div class="face more">+2</div>
      </div>
    </div>
  </body>
</html>
