<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>docs.plus — Get everyone on the same page</title>
    <style>
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #f1f5fd;
      }

      .card {
        position: relative;
        box-sizing: border-box;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        /* blue-white stock: the logo blue washed in low, the light corner blue high */
        background:
          radial-gradient(
            700px 560px at 8% 22%,
            rgba(255, 255, 255, 0.58),
            rgba(255, 255, 255, 0) 68%
          ),
          radial-gradient(
            640px 520px at 30% 112%,
            rgba(38, 120, 255, 0.11),
            rgba(38, 120, 255, 0) 62%
          ),
          radial-gradient(700px 460px at 98% 2%, rgba(26, 35, 126, 0.05), rgba(26, 35, 126, 0) 60%),
          #f1f5fd;
      }

      /* ---------- the sheet ---------- */
      /* v2 tilted -2.6deg over blurred bars. v3 carries real words, so the tilt drops
     to -1.5deg. Past about 2deg the row baselines fight the eye at 474px, which is
     the width this card is really read at. */
      .back {
        position: absolute;
        left: 612px;
        top: 58px;
        width: 880px;
        height: 700px;
        border-radius: 26px;
        background: #fafcff;
        border: 1px solid rgba(17, 32, 66, 0.06);
        box-shadow: 0 26px 52px -26px rgba(17, 32, 66, 0.24);
        transform: rotate(1.2deg);
      }
      .sheet {
        position: absolute;
        left: 592px;
        top: 66px;
        width: 900px;
        height: 720px;
        overflow: hidden;
        border-radius: 28px;
        background: #ffffff;
        border: 1px solid rgba(17, 32, 66, 0.06);
        box-shadow:
          0 48px 92px -30px rgba(17, 32, 66, 0.32),
          0 12px 26px -12px rgba(17, 32, 66, 0.1);
        transform: rotate(-1.5deg);
      }

      /* document shell: the tab strip and the live-room chip */
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 108px;
        border-bottom: 1px solid #eef3fa;
      }
      .tab {
        position: absolute;
        top: 46px;
        height: 18px;
        border-radius: 9px;
      }
      .tab-1 {
        left: 56px;
        width: 190px;
        background: #d7e1f1;
      }
      .tab-2 {
        left: 266px;
        width: 108px;
        background: #e8eef8;
      }
      .tab-3 {
        left: 394px;
        width: 72px;
        background: #f2f6fc;
      }
      .open {
        position: absolute;
        left: 508px;
        top: 36px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        height: 38px;
        border-radius: 19px;
        background: rgba(55, 128, 84, 0.1);
      }
      .open i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #378054;
      }
      .open u {
        width: 56px;
        height: 13px;
        border-radius: 7px;
        background: rgba(55, 128, 84, 0.36);
      }

      /* ---------- the outline ---------- */
      /* v2 proved "a chat on every heading" with blurred bars. v3 proves it with six
     real headings, so a stranger reads a document instead of a diagram. */
      .col-head {
        position: absolute;
        left: 78px;
        top: 142px;
        width: 578px;
        display: flex;
        justify-content: space-between;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #929fb3;
      }
      .col-head .chat-col {
        width: 96px;
        text-align: center;
      }

      .row {
        position: absolute;
        left: 56px;
        width: 600px;
        height: 60px;
        box-sizing: border-box;
        padding: 0 12px 0 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-radius: 15px;
        background: #f5f8fd;
      }
      .row .label {
        font-size: 35px;
        font-weight: 700;
        letter-spacing: -0.014em;
        color: #101a2c;
        white-space: nowrap;
        flex: none;
      }
      /* One quiet row stops the column reading as a solid block of bold. */
      .row.muted .label {
        font-weight: 500;
        color: #7c879a;
      }

      /* Depth, drawn the way the real table of contents draws it: a 28px step per level
     plus a hairline rail down each nested run. A flat list of six rows reads as a menu;
     a tree reads as a document. */
      .row.lvl1 {
        padding-left: 50px;
      }
      .row.lvl2 {
        padding-left: 78px;
      }
      .rail {
        position: absolute;
        width: 2px;
        border-radius: 1px;
        background: #d9e2ef;
      }
      .rail-1 {
        left: 84px;
        top: 252px;
        height: 264px;
      }
      .rail-2 {
        left: 112px;
        top: 388px;
        height: 60px;
      }

      /* Dots, not a hairline: a 1px rule vanishes at 474px, dots survive as texture. */
      .leader {
        flex: 1;
        height: 8px;
        min-width: 44px;
        background-image: radial-gradient(circle, #c2d1e7 3px, transparent 3.2px);
        background-size: 19px 8px;
        background-repeat: repeat-x;
        background-position: left center;
      }

      /* The bubble is load-bearing, not decoration. A number at the end of a dotted
     leader is a page number by convention, and that misread would cost the card
     its whole point. */
      .pill {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 19px 0 15px;
        border-radius: 23px;
        background: #dbe8ff;
      }
      .pill i {
        position: relative;
        width: 23px;
        height: 17px;
        border-radius: 6px;
        background: #2678ff;
        flex: none;
      }
      .pill i::after {
        content: '';
        position: absolute;
        left: 4px;
        bottom: -3px;
        width: 7px;
        height: 7px;
        border-radius: 0 0 2px 0;
        background: #2678ff;
        transform: rotate(45deg);
      }
      .pill b {
        font-size: 29px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #14448f;
      }

      /* ---------- the row someone is in right now ---------- */
      .row.active {
        background: #e2ecff;
      }
      .row.active .pill {
        background: #14448f;
        box-shadow: 0 10px 22px -10px rgba(20, 68, 143, 0.55);
      }
      .row.active .pill i,
      .row.active .pill i::after {
        background: #ffffff;
      }
      .row.active .pill b {
        color: #ffffff;
      }
      .row.active .leader {
        background-image: radial-gradient(circle, #9dbdf0 3px, transparent 3.2px);
      }
      /* Absolute, so the bar costs no flex width and every label stays on one x. */
      .accent {
        position: absolute;
        left: 0;
        top: 10px;
        width: 6px;
        height: 40px;
        border-radius: 0 3px 3px 0;
        background: #2678ff;
      }
      .chip {
        flex: none;
        display: flex;
        align-items: center;
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        border-top-left-radius: 3px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.004em;
        color: #ffffff;
        background: #1a5fd0;
      }
      .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        flex: none;
        background: #378054;
        box-shadow: 0 0 0 5px rgba(55, 128, 84, 0.16);
      }

      .pair {
        flex: none;
        display: flex;
      }
      .pair span {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 0 0 4px #f5f8fd;
      }
      .pair span + span {
        margin-left: -11px;
      }

      /* Pitch 68: a 60px row plus an 8px gutter. The sixth is cut by the card edge on
     purpose, so the outline reads as longer than the card. The muted row is last, so
     the cut lands on the row that matters least. */
      .r1 {
        top: 184px;
      }
      .r2 {
        top: 252px;
      }
      .r3 {
        top: 320px;
      }
      .r4 {
        top: 388px;
      }
      .r5 {
        top: 456px;
      }
      .r6 {
        top: 524px;
      }

      /* ---------- the message ---------- */
      .say {
        position: absolute;
        left: 72px;
        top: 36px;
        width: 560px;
      }
      .lockup {
        position: relative;
        height: 78px;
        margin-bottom: 34px;
      }
      .wordmark {
        position: absolute;
        left: 68px;
        top: 20px;
        font-size: 38px;
        line-height: 38px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: #101a2c;
      }
      /* The main docs.plus icon, used as shipped. Height is set and width follows,
     so the 0.7231 aspect cannot be squashed. */
      .mark {
        position: absolute;
        left: 0;
        top: 2px;
        height: 74px;
        width: auto;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        line-height: 1.06;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #101a2c;
      }
      /* 37px, not 34px. Slack renders the card at 360px, a 0.281 scale, so 34px arrives
     at 9.6px and cannot be read. 37px arrives at 10.4px. It is not 40px because at that
     size "Free, open-source collaborative" ran 16px over the tilted sheet's left edge. */
      .sub {
        margin: 22px 0 0;
        font-size: 37px;
        line-height: 1.26;
        font-weight: 450;
        letter-spacing: -0.008em;
        color: #5a6579;
      }
      .who {
        color: #1a5fd0;
        font-weight: 700;
      }

      /* ---------- the crowd ---------- */
      .presence {
        position: absolute;
        left: 76px;
        top: 424px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .live {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        flex: none;
        background: #378054;
        box-shadow: 0 0 0 7px rgba(55, 128, 84, 0.15);
      }
      .presence p {
        margin: 0;
        font-size: 34px;
        font-weight: 450;
        letter-spacing: -0.004em;
        color: #5a6579;
        white-space: nowrap;
      }
      .presence b {
        color: #101a2c;
        font-weight: 700;
      }
      .crowd {
        position: absolute;
        left: 72px;
        top: 496px;
        display: flex;
      }
      .face {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #ffffff;
        box-shadow:
          0 0 0 5px #f1f5fd,
          0 10px 20px -10px rgba(17, 32, 66, 0.3);
      }
      .face + .face {
        margin-left: -13px;
      }
      .f-ana {
        background: #1a5fd0;
      }
      .f-kofi {
        background: #378054;
      }
      .f-mei {
        background: #ddb13a;
        color: #101a2c;
      }
      .f-ravi {
        background: #dc702f;
        color: #101a2c;
      }
      .f-lena {
        background: #ca3540;
      }
      .more {
        background: #dae3f2;
        color: #3b4759;
        font-size: 27px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="back"></div>

      <div class="sheet">
        <div class="bar">
          <div class="tab tab-1"></div>
          <div class="tab tab-2"></div>
          <div class="tab tab-3"></div>
          <div class="open">
            <i></i>
            <u></u>
          </div>
        </div>

        <div class="col-head">
          <span>CONTENTS</span>
          <span class="chat-col">CHAT</span>
        </div>

        <div class="row r1">
          <span class="label">Background</span>
          <span class="leader"></span>
          <span class="pill">
            <i></i>
            <b>3</b>
          </span>
        </div>

        <div class="row r2 lvl1">
          <span class="label">Consultation</span>
          <span class="leader"></span>
          <span class="pill">
            <i></i>
            <b>17</b>
          </span>
        </div>

        <div class="row r3 active lvl1">
          <span class="accent"></span>
          <span class="label">Budget</span>
          <span class="chip">Ana</span>
          <span class="dot"></span>
          <span class="leader"></span>
          <span class="pill">
            <i></i>
            <b>34</b>
          </span>
        </div>

        <div class="row r4 lvl2">
          <span class="label">Roles</span>
          <span class="leader"></span>
          <span class="pair">
            <span class="f-kofi">K</span>
            <span class="f-mei">M</span>
          </span>
          <span class="pill">
            <i></i>
            <b>9</b>
          </span>
        </div>

        <div class="row r5 lvl1">
          <span class="label">Open questions</span>
          <span class="leader"></span>
          <span class="pill">
            <i></i>
            <b>23</b>
          </span>
        </div>

        <div class="row r6 muted">
          <span class="label">Next meeting</span>
          <span class="leader"></span>
          <span class="pill">
            <i></i>
            <b>5</b>
          </span>
        </div>
        <span class="rail rail-1"></span>
        <span class="rail rail-2"></span>
      </div>

      <div class="say">

            alt="" />

        <h1>
          Get everyone
          <br />
          on the same page

        <p class="sub">
          Free, open-source collaborative
          <br />
          documents for
          <span class="who">communities</span>
        </p>
      </div>

      <div class="presence">
        <span class="live"></span>
        <p>
          <b>7 people</b>
          here right now
        </p>
      </div>

      <div class="crowd">
        <div class="face f-ana">A</div>
        <div class="face f-kofi">K</div>
        <div class="face f-mei">M</div>
        <div class="face f-ravi">R</div>
        <div class="face f-lena">L</div>
        <div class="face more">+2</div>
      </div>
    </div>
  </body>
</html>
