[run]
# bun run puts a node shim to Bun first on PATH, so the prisma:* scripts run the Prisma CLI on Bun. bunx and the image entrypoint do not read this key.
bun = true

[test]
# Seed required env vars before any src module imports (env.schema exits on missing)
preload = ["./tests/setup.ts"]

# `bun build` defaults `.node` to `file`; native addons (sharp) must load as napi.
[loader]
".node" = "napi"
