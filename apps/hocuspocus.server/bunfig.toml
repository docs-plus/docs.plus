[run]
# Puts a node link to bun first on PATH, so the Prisma CLI in the entrypoint runs on Bun.
bun = true

[test]
# Seed required env vars before any src module imports (env.schema exits on missing)
preload = ["./tests/setup.ts"]

# `bun build` defaults `.node` to `file`; native addons (sharp) must load as napi.
[loader]
".node" = "napi"
